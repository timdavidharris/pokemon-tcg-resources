<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon TCG Resource Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="pokedex pixel-outer">
    
    <div class="dex-topbar">
      <div class="dex-lights">
        <div class="big-lens"></div>
        <div class="small-light red"></div>
        <div class="small-light amber"></div>
        <div class="small-light green"></div>
      </div>
      <div class="dex-brand">TRAINER TERMINAL v1.0</div>
    </div>

    <div class="screen pixel-screen">
      
      <header class="title-bar">
        <h1>Pokémon TCG Resource Hub</h1>
        <p class="subtitle">Quick access to official rules, tournament data, and meta resources</p>
      </header>

      <section class="controls-area">
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input pixel-sm" placeholder="Search resources or tap filter badges below..." autocomplete="off">
          <button id="clearBtn" class="clear-btn" aria-label="Clear search">X</button>
        </div>

        <div id="legendBar" class="legend-bar"></div>
      </section>

      <main id="linksContainer"></main>

      <button id="open-qr" class="qr-btn pixel-sm">
        <span>[ 📱 SHARE TERMINAL QR ]</span>
      </button>

    </div>

    <footer class="dex-footer">
      <div class="dpad">
        <div class="dpad-h"></div>
        <div class="dpad-v"></div>
      </div>
      <div class="speaker-grille">
        <div class="speaker-line"></div>
        <div class="speaker-line"></div>
        <div class="speaker-line"></div>
      </div>
    </footer>

  </div>

  <div id="qr-modal" class="modal-overlay">
    <div class="modal-card pixel-outer">
      <p class="modal-title">SCAN TO OPEN TERMINAL</p>
      <div class="qr-container pixel-sm">
        <img id="qr-image" src="" alt="Terminal QR Code">
      </div>
      <div>
        <button id="close-qr" class="close-btn pixel-sm">CLOSE</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
